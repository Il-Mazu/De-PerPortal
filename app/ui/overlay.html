<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
  <title>Dè PerPortal shortcuts</title><link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="notification" role="status" hidden></div>
  <main title="Drag to move shortcuts" aria-label="Dè PerPortal shortcut reminders">
    <button id="close" aria-label="Close shortcut overlay" title="Close — reopen with Overlay in Dè PerPortal">×</button>
    <div id="elements" class="row" aria-label="Element shortcuts"></div>
    <div id="perks" class="row" aria-label="Swap Force perk shortcuts" hidden></div>
    <div id="traps" class="row" aria-label="Trap shortcuts" hidden><span>Traps</span><span>Alt + ↑ Previous</span><span>Alt + ↓ Next</span></div>
  </main>
  <script src="overlay.js"></script>
</body>
</html>
