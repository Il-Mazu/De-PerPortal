<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'">
  <title>Dè PerPortal</title><link rel="stylesheet" href="splash.css">
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Skylanders Dè PerPortal">
    <!-- The top of a Portal of Power; its gilt rim doubles as the progress bar. -->
    <svg class="portal" viewBox="0 0 400 90" aria-hidden="true">
      <ellipse class="base" cx="200" cy="45" rx="180" ry="32"/>
      <ellipse id="fill" class="fill" cx="200" cy="45" rx="180" ry="32" pathLength="100"/>
    </svg>
    <p id="status" role="status" aria-live="polite">Starting…</p>
  </main>
  <span id="version" class="version"></span>
  <script src="splash.js"></script>
</body>
</html>
