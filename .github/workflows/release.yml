name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build portal controller
        shell: cmd
        run: build.cmd
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Package checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "release/SHA256SUMS.txt"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SkyPortal-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            release/*.zip
            release/SHA256SUMS.txt
