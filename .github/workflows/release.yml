name: Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build portal controller
        shell: cmd
        run: build.cmd
      - run: npm ci
      # npm skips Electron's install script, so Electron downloads itself on
      # first require. Do that once here; parallel test files would race.
      - name: Install Electron binary
        run: node -e "require('electron')"
      - run: npm test
      - run: npm run dist
      - name: Package checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "release/SHA256SUMS.txt"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: De-PerPortal-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
      - name: Extract latest release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Get-Content/Set-Content mangle the é/è accents on Windows without an
          # explicit codepage; read and write raw UTF-8 bytes instead.
          $content = [System.IO.File]::ReadAllText("RELEASE_NOTES.md")
          $separator = [regex]::Match($content, '(?m)^---\s*?$')
          $latest = if ($separator.Success) { $content.Substring(0, $separator.Index) } else { $content }
          [System.IO.File]::WriteAllText("release/LATEST_RELEASE_NOTES.md", $latest.TrimEnd() + "`n", [System.Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Dè PerPortal ${{ github.ref_name }}
          make_latest: true
          prerelease: false
          body_path: release/LATEST_RELEASE_NOTES.md
          files: |
            release/*.zip
            release/SHA256SUMS.txt
